name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FileProcessing.slnx

      - name: Build
        run: dotnet build FileProcessing.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FileProcessing.slnx --configuration Release --no-build --no-restore
